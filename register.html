<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Ugobest Music Label</title>
    <link rel="stylesheet" type="text/css" href="register.css" />
  </head>
  <body>
    <nav id="navbar">
      <a href="index.html">Home</a>
      <a href="our artists.html">Our Artist</a>
      <a href="register.html">Register</a>
    </nav>

    <main class="register-page">
      <section class="register-intro">
        <p class="eyebrow">Join the movement</p>
        <h1>Become part of our next wave of talent.</h1>
        <p>
          Tell us about yourself and your music. Our team will review your details
          and get in touch if there is a good fit.
        </p>
      </section>

      <section class="form-panel">
        <form class="register-form" method="post">
          <div class="form-grid">
            <label>
              First Name
              <input type="text" name="firstname" autocomplete="given-name" placeholder="First name" required />
            </label>

            <label>
              Last Name
              <input type="text" name="lastname" autocomplete="family-name" placeholder="Last name" required />
            </label>

            <label>
              Artist or Band Name
              <input type="text" name="artistname" autocomplete="organization" placeholder="Your artist name" required />
            </label>

            <label>
              Email Address
              <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required />
            </label>

            <label>
              Phone Number (optional)
              <input type="tel" name="phone" autocomplete="tel" placeholder="+234 800 000 0000" />
            </label>

            <label>
              Primary Genre
              <select name="genre" required>
                <option value="">Select a genre</option>
                <option value="Afrobeats">Afrobeats</option>
                <option value="Hip-hop">Hip-hop</option>
                <option value="R&B">R&amp;B</option>
                <option value="Gospel">Gospel</option>
                <option value="Other">Other</option>
              </select>
            </label>

            <label>
              Music or Profile Link
              <input type="url" name="musiclink" placeholder="https://..." />
            </label>

            <label class="full-width">
              Tell us about yourself and your music
              <textarea name="bio" rows="5" maxlength="1000" placeholder="A short introduction to you and your music"></textarea>
            </label>
          </div>

          <button type="submit" class="submit-btn">Submit application</button>
          <a href="index.html" class="button-link">Go back to home page</a>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
